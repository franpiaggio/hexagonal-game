<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pila de fichas</title>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Tablero hexagonal"></canvas>

    <div class="hud top">
      <div><span class="label">Puntos</span><strong id="score">0</strong></div>
      <div><span class="label">Fichas</span><strong id="left">0</strong></div>
    </div>

    <div class="hud zones" id="zones"></div>

    <div class="hud stack">
      <div class="next-row">
        <canvas id="next2" width="64" height="64" aria-hidden="true"></canvas>
        <canvas id="next1" width="64" height="64" aria-hidden="true"></canvas>
      </div>
      <canvas id="current" width="140" height="140" aria-label="Ficha actual"></canvas>
      <div class="buttons">
        <button id="ccw" type="button" aria-label="Girar a la izquierda (Q)">⟲</button>
        <button id="cw" type="button" aria-label="Girar a la derecha (E)">⟳</button>
      </div>
    </div>

    <div class="hud help">Click: apoyar · Q/E o click derecho: girar · arrastrar: mover · rueda: zoom · N: nueva partida</div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="over" class="over" hidden>
      <div class="card">
        <p class="label">Pila vacía</p>
        <p class="final"><strong id="final">0</strong> puntos</p>
        <button id="again" type="button">Otra partida</button>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
